<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>TODO crud using generic function</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <div class="container">
        <div class="row mt-5">
            <div class="col-md-4">
                <form id="form">
                    <div class="card shadow">
                     <div class="card-header">
                       <h3> Add your Todo</h3>
                     </div>
                     <div class="card-body">
                        <div class="form-group">
                            <label for="todoItem">Todo item:-</label>
                            <input type="text" class="form-control" id="todos">
                        </div>
                     </div>
                     <div class="card-footer">
                        <button type="submit" class="btn btn-sm btn-primary" id="addBtn">Add TODO</button>
                        <button type="button" class="btn btn-sm btn-success d-none" id="updateBtn">Update TODO</button>
                     </div>
                </div>
                </form>
            </div>
            <div class="col-md-4 offset-md-2">
                <div class="card shadow">
                    <ul class="list-group" id="todoContainer">
                    <!-- <li class="list-group-item d-flex justify-content-between">
                        <strong>html</strong>
                        <div>
                            <button class="btn btn-sm btn-outline-primary">Edit</button>
                            <button class="btn btn-sm btn-outline-danger">Remove</button>
                        </div>
                    </li> -->
                </ul>
                </div>
            </div>
        </div>
    </div>

    <div class="spinner" id="spinner">
      <div class="spinner-border" role="status">
        <span class="sr-only">Loading...</span>
     </div>
  </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>
</html>
